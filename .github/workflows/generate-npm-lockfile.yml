name: Generate customer app npm lockfile

on:
  push:
    branches:
      - fix/phase0-npm-lockfile
    paths:
      - 'app/package.json'
      - '.github/workflows/generate-npm-lockfile.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate package lock without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to this PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          if [ ! -f app/package-lock.json ]; then
            echo "::error::npm did not generate app/package-lock.json"
            exit 1
          fi
          if [ -z "$(git status --porcelain -- app/package-lock.json)" ]; then
            echo "package-lock.json is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package-lock.json
          git commit -m "Add reproducible customer app npm lockfile"
          git push origin HEAD:fix/phase0-npm-lockfile
