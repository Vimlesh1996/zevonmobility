name: ZEVON Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - zevon-app-v1
      - zevon-final-v1
      - feature/direct-apk-auto-update
      - feature/customer-app-rebuild
      - feature/zevon-fcm-update-notifications
    paths:
      - 'app/**'
      - '.github/workflows/zevon-android.yml'
      - '.github/workflows/zevon-signed-apk-release.yml'
      - '.github/scripts/**'

permissions:
  contents: read

jobs:
  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Lint customer app JavaScript
        run: npm run lint

      - name: Run customer app tests
        run: npm test

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Firebase Android client when google-services.json is available
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            python3 - <<'PY'
          import re
          from pathlib import Path
          root = Path("android/build.gradle")
          root_text = root.read_text()
          if "com.google.gms:google-services" not in root_text:
              root_text, count = re.subn(r'(dependencies\\s*\\{)', r"\\1\\n        classpath 'com.google.gms:google-services:4.4.4'", root_text, count=1)
              if count != 1:
                  raise SystemExit("Could not add Google Services Gradle classpath")
              root.write_text(root_text)
          app = Path("android/app/build.gradle")
          app_text = app.read_text()
          if "com.google.gms.google-services" not in app_text:
              app.write_text(app_text + "\\napply plugin: 'com.google.gms.google-services'\\n")
          PY
          else
            echo "::warning::google-services.json is missing; FCM client initialization will not work in this debug APK."
          fi

      - name: Set Android version from package.json
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          version = json.loads(Path("package.json").read_text())["version"]
          parts = version.split(".")
          if len(parts) != 3 or not all(x.isdigit() for x in parts):
              raise SystemExit("app/package.json version must use MAJOR.MINOR.PATCH")
          major, minor, patch = map(int, parts)
          code = major * 1000000 + minor * 1000 + patch
          gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          source, count = re.subn(r'(defaultConfig\s*\{)', r'\1\n        versionCode ' + str(code) + '\n        versionName "' + version + '"', source, count=1)
          if count != 1:
              raise SystemExit("Unable to set Android version in generated Gradle file")
          gradle.write_text(source)
          PY

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zevon-mobility-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14