name: ZEVON Android Build

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Customer app source branch to build"
        required: true
        default: feature/customer-app-rebuild
        type: string
  pull_request:
    branches:
      - feature/customer-app-rebuild
    paths:
      - 'app/**'
      - '.github/workflows/zevon-android.yml'
  push:
    branches:
      - feature/customer-app-rebuild
    paths:
      - 'app/**'
      - '.github/workflows/zevon-android.yml'

permissions:
  contents: read

jobs:
  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout customer app source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'push' && github.sha) || inputs.source_branch || 'feature/customer-app-rebuild' }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Lint customer app JavaScript
        run: npm run lint

      - name: Run customer app tests
        run: npm test

      - name: Generate Android project
        run: npx cap add android

      - name: Disable Android cloud backup for local enquiry data
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          source, count = re.subn(
              r'android:allowBackup="(?:true|false)"',
              'android:allowBackup="false"',
              source,
              count=1
          )
          if count != 1:
              raise SystemExit("Could not set android:allowBackup=false in generated manifest")
          manifest.write_text(source)
          PY

      - name: Create temporary CI signing key
        env:
          STORE_PASSWORD: ci-only-temporary-password
        run: |
          keytool -genkeypair -noprompt \
            -keystore zevon-release.keystore \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias ci-release \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=ZEVON CI, OU=Build, O=ZEVON, C=IN"

      - name: Configure v1.0.9 release metadata and signing
        env:
          RELEASE_TAG: v1.0.9
          KEY_ALIAS: ci-release
          STORE_PASSWORD: ci-only-temporary-password
          KEY_PASSWORD: ci-only-temporary-password
        run: python3 scripts/configure-android-release.py

      - name: Sync web assets
        run: |
          npx cap sync android
          cmp www/index.html android/app/src/main/assets/public/index.html
          cmp www/sw.js android/app/src/main/assets/public/sw.js

      - name: Build debug and temporary signed release APKs
        env:
          KEY_ALIAS: ci-release
          STORE_PASSWORD: ci-only-temporary-password
          KEY_PASSWORD: ci-only-temporary-password
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --no-daemon
          cd ..
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.zevon.mobility'"
          echo "$BADGING" | grep -F "versionName='1.0.9'"
          echo "$BADGING" | grep -F "versionCode='1000009'"
          "$APKSIGNER" verify --verbose "$APK"
          rm -f zevon-release.keystore

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zevon-mobility-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14