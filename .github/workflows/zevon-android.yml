name: ZEVON Android Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/customer-app-rebuild
      - fix/phase0-stale-ui-updater
      - fix/phase0-release-config-test
    paths:
      - 'app/**'
      - '.github/workflows/zevon-android.yml'
      - '.github/workflows/zevon-signed-apk-release.yml'
  push:
    branches:
      - zevon-app-v1
      - zevon-final-v1
      - feature/direct-apk-auto-update
      - feature/customer-app-rebuild
    paths:
      - 'app/**'
      - '.github/workflows/zevon-android.yml'

permissions:
  contents: read

jobs:
  android-debug:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Install dependencies
        run: npm ci

      - name: Lint customer app JavaScript
        run: npm run lint

      - name: Run customer app tests
        run: npm test

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Android FileProvider and notification permission
        run: python3 scripts/configure-android-platform.py

      - name: Disable Android cloud backup for local enquiry data
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          source, count = re.subn(
              r'android:allowBackup="(?:true|false)"',
              'android:allowBackup="false"',
              source,
              count=1
          )
          if count != 1:
              raise SystemExit("Could not set android:allowBackup=false in generated manifest")
          manifest.write_text(source)
          PY

      - name: Create temporary CI signing key
        env:
          STORE_PASSWORD: ci-only-temporary-password
        run: |
          keytool -genkeypair -noprompt \
            -keystore zevon-release.keystore \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -alias ci-release \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=ZEVON CI, OU=Build, O=ZEVON, C=IN"

      - name: Read app version as the CI source of truth
        id: app-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          VERSION_CODE="$(node -e "const c=require('./www/update-manifest.js');process.stdout.write(String(c.versionCode(process.argv[1])))" "$VERSION")"
          test "$VERSION_CODE" -gt 0
          {
            echo "version=$VERSION"
            echo "version_code=$VERSION_CODE"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Configure app version metadata and signing
        env:
          RELEASE_TAG: ${{ steps.app-version.outputs.tag }}
          KEY_ALIAS: ci-release
          STORE_PASSWORD: ci-only-temporary-password
          KEY_PASSWORD: ci-only-temporary-password
        run: python3 scripts/configure-android-release.py

      - name: Sync web assets
        run: |
          npx cap sync android
          cmp www/index.html android/app/src/main/assets/public/index.html
          cmp www/sw.js android/app/src/main/assets/public/sw.js

      - name: Build debug and temporary signed release APKs
        env:
          EXPECTED_VERSION: ${{ steps.app-version.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ steps.app-version.outputs.version_code }}
          KEY_ALIAS: ci-release
          STORE_PASSWORD: ci-only-temporary-password
          KEY_PASSWORD: ci-only-temporary-password
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --no-daemon
          cd ..
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='com.zevon.mobility'"
          echo "$BADGING" | grep -F "versionName='$EXPECTED_VERSION'"
          echo "$BADGING" | grep -F "versionCode='$EXPECTED_VERSION_CODE'"
          "$APKSIGNER" verify --verbose "$APK"
          rm -f zevon-release.keystore

      - name: Verify merged Android platform manifest
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          from pathlib import Path
          android = '{http://schemas.android.com/apk/res/android}'
          candidates = glob.glob('android/app/build/intermediates/merged_manifest/debug/**/AndroidManifest.xml', recursive=True)
          if len(candidates) != 1:
              raise SystemExit(f'Expected one merged debug manifest, found {len(candidates)}: {candidates}')
          manifest_path = Path(candidates[0])
          manifest = ET.parse(manifest_path).getroot()
          permissions = {p.get(android + 'name') for p in manifest.findall('uses-permission')}
          required = {'android.permission.REQUEST_INSTALL_PACKAGES', 'android.permission.POST_NOTIFICATIONS'}
          missing = required - permissions
          if missing:
              raise SystemExit(f'Merged manifest is missing permissions: {sorted(missing)}')
          app = manifest.find('application')
          providers = [p for p in app.findall('provider') if p.get(android + 'authorities') == 'com.zevon.mobility.fileprovider']
          if len(providers) != 1:
              raise SystemExit(f'Expected exactly one ZEVON FileProvider, found {len(providers)}')
          provider = providers[0]
          if provider.get(android + 'name') != 'androidx.core.content.FileProvider' or provider.get(android + 'exported') != 'false' or provider.get(android + 'grantUriPermissions') != 'true':
              raise SystemExit('Merged FileProvider security attributes are incorrect')
          metadata = [m for m in provider.findall('meta-data') if m.get(android + 'name') == 'android.support.FILE_PROVIDER_PATHS']
          if len(metadata) != 1 or metadata[0].get(android + 'resource') != '@xml/file_paths':
              raise SystemExit('Merged FileProvider paths metadata is incorrect')
          source_paths = ET.parse('android/app/src/main/res/xml/file_paths.xml').getroot()
          entries = list(source_paths)
          if len(entries) != 1 or entries[0].tag != 'cache-path' or entries[0].get('path') != 'apk-updates/':
              raise SystemExit('FileProvider must expose only cache/apk-updates/')
          print(f'Validated merged manifest: {manifest_path}')
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zevon-mobility-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload merged manifest audit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zevon-android-platform-manifest
          path: |
            app/android/app/build/intermediates/merged_manifest/debug/**/AndroidManifest.xml
            app/android/app/src/main/res/xml/file_paths.xml
          if-no-files-found: error
          retention-days: 14