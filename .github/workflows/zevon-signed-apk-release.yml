name: ZEVON Signed Direct APK Release

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - 'feature/zevon-fcm-update-notifications'

permissions:
  contents: write

jobs:
  signed-release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "::error::Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)

      - name: Decode private release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > zevon-release.keystore
          chmod 600 zevon-release.keystore

      - name: Diagnose release keystore and private key
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cat > VerifyReleaseKeystore.java <<'JAVA'
          import java.io.FileInputStream;
          import java.security.Key;
          import java.security.KeyStore;
          import java.security.PrivateKey;

          public class VerifyReleaseKeystore {
              public static void main(String[] args) throws Exception {
                  String alias = System.getenv("KEY_ALIAS");
                  char[] storePassword = System.getenv("STORE_PASSWORD").toCharArray();
                  char[] keyPassword = System.getenv("KEY_PASSWORD").toCharArray();
                  String[] types = {"JKS", "PKCS12"};
                  Exception lastError = null;

                  for (String type : types) {
                      try {
                          KeyStore ks = KeyStore.getInstance(type);
                          try (FileInputStream in = new FileInputStream("zevon-release.keystore")) {
                              ks.load(in, storePassword);
                          }
                          System.out.println("PASS: keystore file opened (" + type + ")");
                          if (!ks.containsAlias(alias)) {
                              System.err.println("FAIL: configured alias was not found in the keystore");
                              System.exit(2);
                          }
                          System.out.println("PASS: configured alias exists");
                          Key key = ks.getKey(alias, keyPassword);
                          if (!(key instanceof PrivateKey)) {
                              System.err.println("FAIL: configured alias does not contain a private key");
                              System.exit(3);
                          }
                          System.out.println("PASS: private key unlocked successfully");
                          return;
                      } catch (java.security.UnrecoverableKeyException e) {
                          System.err.println("FAIL: keystore opened, but the private key could not be unlocked with ANDROID_KEY_PASSWORD");
                          System.exit(4);
                      } catch (Exception e) {
                          lastError = e;
                      }
                  }
                  System.err.println("FAIL: keystore could not be opened with ANDROID_KEYSTORE_PASSWORD (or its format is unsupported)");
                  System.exit(5);
              }
          }
          JAVA
          javac VerifyReleaseKeystore.java
          java VerifyReleaseKeystore

      - name: Install dependencies and run tests
        run: |
          npm install --no-package-lock
          npm run lint
          npm test

      - name: Generate Android project
        run: npx cap add android

      - name: Configure Firebase Android client when google-services.json is available
        working-directory: app
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            python3 - <<'PY'
          import re
          from pathlib import Path
          root = Path("android/build.gradle")
          root_text = root.read_text()
          if "com.google.gms:google-services" not in root_text:
              root_text, count = re.subn(r'(dependencies\s*\{)', r"\1\n        classpath 'com.google.gms:google-services:4.4.4'", root_text, count=1)
              if count != 1:
                  raise SystemExit("Could not add Google Services Gradle classpath")
              root.write_text(root_text)
          app = Path("android/app/build.gradle")
          app_text = app.read_text()
          if "com.google.gms.google-services" not in app_text:
              app.write_text(app_text + "\napply plugin: 'com.google.gms.google-services'\n")
          PY
          else
            echo "::warning::google-services.json is missing; FCM client initialization will not work in this APK."
          fi

      - name: Configure version and release signing
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.3' }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"].lstrip("v")
          parts = tag.split(".")
          if len(parts) != 3 or not all(x.isdigit() for x in parts):
              raise SystemExit("Release tag must use vMAJOR.MINOR.PATCH")
          major, minor, patch = map(int, parts)
          code = major * 1000000 + minor * 1000 + patch
          p = Path("android/app/build.gradle")
          s = p.read_text()
          # Replace generated defaults; do not add duplicate Gradle assignments.
          s, code_count = re.subn(r'(?m)^\\s*versionCode\\s+\\d+\\s*$', '        versionCode ' + str(code), s, count=1)
          s, name_count = re.subn(r'(?m)^\\s*versionName\\s+"[^"]*"\\s*$', '        versionName "' + tag + '"', s, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not replace generated Android versionCode/versionName")
          signing = '''
              signingConfigs {
                  release {
                      storeFile file("../../zevon-release.keystore")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''
          if "signingConfigs {" in s:
              raise SystemExit("Unexpected existing signingConfigs block; inspect before release")
          s, n = re.subn(r'(    buildTypes\s*\{\s*release\s*\{)', signing + r'\n\1\n            signingConfig signingConfigs.release', s, count=1)
          if n != 1:
              raise SystemExit("Could not attach release signing config")
          p.write_text(s)
          PY

      - name: Sync and build signed release APK
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.3' }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk "ZEVON-Mobility-${RELEASE_TAG}.apk"
          sha256sum "ZEVON-Mobility-${RELEASE_TAG}.apk" > "ZEVON-Mobility-${RELEASE_TAG}.apk.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "ZEVON-Mobility-${RELEASE_TAG}.apk"

      - name: Upload signed validation APK
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: zevon-mobility-signed-validation-apk
          path: |
            app/ZEVON-Mobility-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.3' }}.apk
            app/ZEVON-Mobility-${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.3' }}.apk.sha256
          retention-days: 7

      - name: Publish GitHub Release for in-app updater
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; uploading/replacing its APK assets."
            gh release upload "${RELEASE_TAG}" \
              "ZEVON-Mobility-${RELEASE_TAG}.apk" \
              "ZEVON-Mobility-${RELEASE_TAG}.apk.sha256" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "ZEVON-Mobility-${RELEASE_TAG}.apk" \
              "ZEVON-Mobility-${RELEASE_TAG}.apk.sha256" \
              --title "ZEVON Mobility ${RELEASE_TAG}" \
              --generate-notes
          fi

      - name: Send FCM update notification to subscribed Android devices
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        env:
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.3' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -z "$FCM_SERVICE_ACCOUNT_JSON" ]; then
            echo "FCM notification skipped: configure FCM_SERVICE_ACCOUNT_JSON after Firebase setup."
            exit 0
          fi
          python3 -m pip install --quiet google-auth
          python3 .github/scripts/send-fcm-update.py
