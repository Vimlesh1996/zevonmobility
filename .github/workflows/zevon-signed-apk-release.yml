name: ZEVON Signed Direct APK Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag, for example v1.0.9'
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  signed-release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout customer app source
        uses: actions/checkout@v5
        with:
          ref: feature/customer-app-rebuild

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "::error::Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)

      - name: Decode private release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > zevon-release.keystore
          chmod 600 zevon-release.keystore

      - name: Install dependencies and run tests
        run: |
          npm install --no-package-lock
          npm run lint
          npm test

      - name: Generate Android project
        run: npx cap add android

      - name: Configure version and release signing
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"].lstrip("v")
          parts = tag.split(".")
          if len(parts) != 3 or not all(part.isdigit() for part in parts):
              raise SystemExit("Release tag must use vMAJOR.MINOR.PATCH")
          major, minor, patch = map(int, parts)
          version_code = major * 1000000 + minor * 1000 + patch

          package_file = Path("package.json")
          package_data = json.loads(package_file.read_text())
          package_data["version"] = tag
          package_file.write_text(json.dumps(package_data, indent=2) + "\n")

          html_file = Path("www/index.html")
          html = html_file.read_text()
          html, html_count = re.subn(
              r"Version\s+\d+\.\d+\.\d+",
              "Version " + tag,
              html,
              count=1
          )
          if html_count != 1:
              raise SystemExit("Could not update the in-app version label")
          html_file.write_text(html)

          gradle_file = Path("android/app/build.gradle")
          gradle = gradle_file.read_text()
          gradle, code_count = re.subn(
              r'(?m)^(\s*versionCode\s+)\d+\s*$',
              lambda match: match.group(1) + str(version_code),
              gradle,
              count=1
          )
          gradle, name_count = re.subn(
              r'(?m)^(\s*versionName\s+)[\'"][^\'"]+[\'"]\s*$',
              lambda match: match.group(1) + '"' + tag + '"',
              gradle,
              count=1
          )
          if code_count != 1 or name_count != 1:
              raise SystemExit(
                  f"Expected exactly one Android versionCode and versionName; "
                  f"found {code_count} and {name_count}"
              )

          signing = """
              signingConfigs {
                  release {
                      storeFile file("../../zevon-release.keystore")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("STORE_PASSWORD")
                  }
              }
          """
          if "signingConfigs {" in gradle:
              raise SystemExit("Unexpected existing signingConfigs block; inspect before release")
          gradle, signing_count = re.subn(
              r'(    buildTypes\s*\{\s*release\s*\{)',
              signing + r'\n\1\n            signingConfig signingConfigs.release',
              gradle,
              count=1
          )
          if signing_count != 1:
              raise SystemExit("Could not attach release signing config")

          gradle_file.write_text(gradle)
          print(f"Configured app version {tag} (versionCode {version_code})")
          PY

      - name: Sync and build signed release APK
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew assembleRelease --refresh-dependencies; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Gradle build failed after 3 attempts."
              exit 1
            fi
            echo "Gradle build attempt $attempt failed; retrying in 20 seconds..."
            sleep 20
          done
          cd ..
          APK_FILE="ZEVON-Mobility-${RELEASE_TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK_FILE"
          sha256sum "$APK_FILE" > "$APK_FILE.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK_FILE"
          BADGING="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK_FILE")"
          VERSION="${RELEASE_TAG#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          EXPECTED_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "$BADGING" | grep -F "versionName='$VERSION'"
          echo "$BADGING" | grep -F "versionCode='$EXPECTED_CODE'"
          grep -F "Version $VERSION" www/index.html

      - name: Publish GitHub Release for in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          APK_FILE="ZEVON-Mobility-${RELEASE_TAG}.apk"
          CHECKSUM_FILE="${APK_FILE}.sha256"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; replacing APK assets."
            gh release upload "$RELEASE_TAG" "$APK_FILE" "$CHECKSUM_FILE" --clobber
          else
            gh release create "$RELEASE_TAG" "$APK_FILE" "$CHECKSUM_FILE" \
              --title "ZEVON Mobility $RELEASE_TAG" \
              --generate-notes
          fi
