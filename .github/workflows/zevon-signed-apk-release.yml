name: ZEVON Signed Direct APK Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  signed-release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "::error::Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Missing ANDROID_KEY_PASSWORD secret" && exit 1)

      - name: Decode private release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > zevon-release.keystore
          chmod 600 android/zevon-release.keystore

      - name: Install dependencies and test
        run: |
          npm install --no-package-lock
          npm test

      - name: Generate Android project
        run: npx cap add android

      - name: Configure version and signing
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          tag = os.environ["RELEASE_TAG"].lstrip("v")
          parts = [int(x) for x in tag.split(".")]
          if len(parts) != 3 or any(x < 0 for x in parts):
              raise SystemExit("Tag must use vMAJOR.MINOR.PATCH")
          code = parts[0] * 1000000 + parts[1] * 1000 + parts[2]
          s = re.sub(r'(defaultConfig\s*\{)', r'\1\n        versionCode ' + str(code) + '\n        versionName "' + tag + '"', s, count=1)
          signing = '''
              signingConfigs {
                  release {
                      storeFile file("../../zevon-release.keystore")
                      storePassword System.getenv("STORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''
          s = s.replace("    buildTypes {", signing + "\n    buildTypes {", 1)
          s = re.sub(r'(release\s*\{)', r'\1\n            signingConfig signingConfigs.release', s, count=1)
          p.write_text(s)
          PY

      - name: Sync and build signed release APK
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk "ZEVON-Mobility-${GITHUB_REF_NAME}.apk"
          sha256sum "ZEVON-Mobility-${GITHUB_REF_NAME}.apk" > "ZEVON-Mobility-${GITHUB_REF_NAME}.apk.sha256"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "ZEVON-Mobility-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub Release for in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "ZEVON-Mobility-${GITHUB_REF_NAME}.apk" \
            "ZEVON-Mobility-${GITHUB_REF_NAME}.apk.sha256" \
            --title "ZEVON Mobility ${GITHUB_REF_NAME}" \
            --generate-notes
