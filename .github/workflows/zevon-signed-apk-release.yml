name: ZEVON Signed Direct APK Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  signed-release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || (echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "::error::Missing ANDROID_KEY_ALIAS secret" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "::error::Missing ANDROID_KEYSTORE_PASSWORD secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "::error::Missing ANDROID_KEY_PASSWORD secret" && exit 1)

      - name: Decode private release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > zevon-release.keystore
          chmod 600 zevon-release.keystore

      - name: Install dependencies and run tests
        run: |
          npm install --no-package-lock
          npm run lint
          npm test

      - name: Generate Android project
        run: npx cap add android

      - name: Configure version and release signing
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/configure-android-release.py

      - name: Sync and build signed release APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cd ..
          cp android/app/build/outputs/apk/release/app-release.apk "ZEVON-Mobility-${GITHUB_REF_NAME}.apk"
          sha256sum "ZEVON-Mobility-${GITHUB_REF_NAME}.apk" > "ZEVON-Mobility-${GITHUB_REF_NAME}.apk.sha256"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose "ZEVON-Mobility-${GITHUB_REF_NAME}.apk"
          python3 scripts/generate-update-manifest.py \
            --apk "ZEVON-Mobility-${GITHUB_REF_NAME}.apk" \
            --tag "${GITHUB_REF_NAME}" \
            --output update.json \
            --aapt "$AAPT" \
            --apksigner "$APKSIGNER"

      - name: Publish GitHub Release for in-app updater
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "ZEVON-Mobility-${GITHUB_REF_NAME}.apk" \
            "ZEVON-Mobility-${GITHUB_REF_NAME}.apk.sha256" \
            "update.json" \
            --title "ZEVON Mobility ${GITHUB_REF_NAME}" \
            --generate-notes
