name: Validate ZEVON release workflow

on:
  push:
    branches:
      - fix/phase0-release-pipeline
    paths:
      - '.github/workflows/zevon-signed-apk-release.yml'
      - '.github/workflows/validate-release-workflow.yml'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/zevon-signed-apk-release.yml'
      - '.github/workflows/validate-release-workflow.yml'

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      - name: Validate GitHub Actions workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/zevon-signed-apk-release.yml
