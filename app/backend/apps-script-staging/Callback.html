<!doctype html>
<html>
<head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZEVON Driver Sign-In — Staging</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f3f6f4;color:#14231e;font:16px Arial,sans-serif;display:grid;place-items:center;padding:24px}
main{width:min(100%,460px);background:#fff;border:1px solid #dce5df;border-radius:22px;padding:30px;box-shadow:0 16px 50px #13251a12}
.brand{font-weight:800;letter-spacing:2px;color:#176b4a}.tag{font-size:12px;color:#738078;letter-spacing:1.5px;margin-top:5px}
h1{font-size:26px;margin:28px 0 8px}.muted{color:#627068;line-height:1.55;font-size:14px}
#status{padding:14px;border-radius:10px;background:#edf7f0;color:#24583c;line-height:1.5}.error{background:#fff0ef!important;color:#9c2923!important}
button{margin-top:18px;padding:11px 18px;border:0;border-radius:8px;background:#176b4a;color:#fff;font-weight:700;cursor:pointer}
.small{font-size:12px;color:#7b877f;margin-top:24px}
</style></head>
<body><main>
<div class="brand">ZEVON MOBILITY</div><div class="tag">DRIVER PORTAL · STAGING</div>
<h1><?= ok ? 'Sign-in successful' : 'Sign-in not completed' ?></h1>
<div id="status" class="<?= ok ? '' : 'error' ?>"><?= message ?></div>
<? if (ok) { ?>
<p><strong><?= driverName ?></strong></p><p class="muted">Driver ID: <?= driverId ?></p>
<button id="logout" type="button">Sign out</button>
<script>
const token = <?!= JSON.stringify(sessionToken) ?>;
document.getElementById('logout').addEventListener('click', function(){
  this.disabled = true;
  google.script.run.withSuccessHandler(function(){
    document.getElementById('status').textContent='You have signed out. The staging session was revoked.';
    document.getElementById('status').classList.remove('error');
    document.getElementById('logout').style.display='none';
  }).withFailureHandler(function(){
    document.getElementById('status').textContent='Sign-out failed. Please retry.';
    document.getElementById('logout').disabled=false;
  }).logoutDriver(token);
});
</script>
<? } ?>
<p class="small">STAGING ONLY · No customer booking data · No production system connection</p>
</main></body></html>
